name: Update combined EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: combined-epg-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build filtered combined XMLTV
        env:
          STRONG_USERNAME: ${{ secrets.STRONG_USERNAME }}
          STRONG_PASSWORD: ${{ secrets.STRONG_PASSWORD }}
        run: python build_epg.py

      - name: Publish updated guide and mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined.xml.gz strong_epg_match_report.csv strong_epg_map.json
          if git diff --cached --quiet; then
            echo "Guide and mapping unchanged; no commit needed."
          else
            git commit -m "Update combined XMLTV guide and Strong EPG map"
            git push
          fi
