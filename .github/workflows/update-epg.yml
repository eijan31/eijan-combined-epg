
name: Update combined EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: combined-epg-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build combined XMLTV with dummy channels
        run: python build_epg.py

      - name: Publish updated combined guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add combined.xml.gz

          if git diff --cached --quiet; then
            echo "Combined guide unchanged; no commit needed."
          else
            git commit -m "Update combined XMLTV guide"
            git push
          fi
